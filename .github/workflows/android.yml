name: Build Android APK

# - Every push to main or dev builds a signed APK (download it from the run's
#   "Artifacts" section).
# - Pushes to main also publish it as a GitHub Release, so phones can grab
#   the latest version from the repo's Releases page.
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Build web app and copy it into Android
        run: npm run android:sync

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.GROOV_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/groov-release.jks"
            echo "GROOV_KEYSTORE_FILE=$RUNNER_TEMP/groov-release.jks" >> "$GITHUB_ENV"
            echo "Signing with the Groov release key."
          else
            echo "::warning::GROOV_KEYSTORE_BASE64 secret not set — APK is signed with a throwaway debug key and won't install over previous builds."
          fi

      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          GROOV_KEYSTORE_PASSWORD: ${{ secrets.GROOV_KEYSTORE_PASSWORD }}
          GROOV_KEY_ALIAS: groov
          GROOV_KEY_PASSWORD: ${{ secrets.GROOV_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Report build errors
        if: failure()
        run: |
          # Surface compiler/Gradle errors as one annotation, readable on the run page.
          LOG="$RUNNER_TEMP/gradle.log"
          [ -f "$LOG" ] || exit 0
          MSG=$(grep -E "error:|e: |What went wrong|Could not (resolve|find)|> " "$LOG" | grep -v "^> Task" | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Gradle build failed::${MSG}"

      - name: Name the APK
        id: apk
        run: |
          VERSION=$(node -p "require('./package.json').version")
          BRANCH="${GITHUB_REF_NAME//\//-}"
          NAME="groov-v${VERSION}-build${GITHUB_RUN_NUMBER}-${BRANCH}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          retention-days: 30

      - name: Publish release (main only)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}-build${{ github.run_number }}
          name: Groov v${{ steps.apk.outputs.version }} (build ${{ github.run_number }})
          files: ${{ steps.apk.outputs.name }}
          make_latest: true
          generate_release_notes: true

      - name: Keep only the newest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: v${{ steps.apk.outputs.version }}-build${{ github.run_number }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' |
            while read -r tag; do
              [ "$tag" = "$KEEP" ] && continue
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
            done
