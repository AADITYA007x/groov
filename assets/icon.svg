<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1e1e1e"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1ed760"/>
      <stop offset="100%" stop-color="#149c47"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#bgGrad)"/>

  <circle cx="512" cy="512" r="300" fill="none" stroke="url(#ringGrad)" stroke-width="28"/>

  <!-- three ascending bars forming an abstract "G" / equalizer motif -->
  <rect x="404" y="560" width="54" height="130" rx="27" fill="#1ed760"/>
  <rect x="485" y="480" width="54" height="210" rx="27" fill="#1ed760"/>
  <rect x="566" y="400" width="54" height="290" rx="27" fill="#1ed760"/>

  <!-- play triangle notch cut from the ring, bottom-right -->
  <path d="M 700 560 L 700 680 L 800 620 Z" fill="#1ed760"/>
</svg>
